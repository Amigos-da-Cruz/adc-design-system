name: Publicar pacote
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@amigos-da-cruz'
      - run: npm ci
      - name: Confirmar versão da tag
        run: node -e "const p = require('./package.json'); if ('v' + p.version !== process.env.GITHUB_REF_NAME) throw new Error('A tag deve ser v' + p.version)"
      - run: npm run tokens
      - name: Tokens gerados estão em sincronia
        run: git diff --exit-code src/styles/tokens.css
      - run: npm run typecheck
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
